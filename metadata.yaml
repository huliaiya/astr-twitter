name: astrbot_plugin_twitter
display_name: 推特解析（astr-twitter）
short_desc: 自动解析 X/Twitter 链接，直发视频、图片与 GIF
desc: |
  自动识别聊天里的 X / Twitter 链接并解析成可发送的媒体。

  支持内容：视频（多清晰度自动取最高的一档，通常是 720p）、图片（单图/多图）、
  GIF（以 mp4 发送），接口返回音频时可选以语音发送。
  发送的简介包含：作者、媒体类型与分辨率/时长、原文（可分别开关）。
  发送方式：媒体直接发到会话；也可用 `/解析 <链接>` 手动触发。

  自动解析默认关闭（避免打扰群聊），管理员发一次 `/开启解析` 即可开启本会话，
  或 `/开启解析 全局` 一次开给所有会话；`/关闭解析` 反向操作。

  指令：
    /解析 <链接>       手动解析（别名 /推特解析 /tw /x解析）
    /开启解析 [全局]   开启自动解析（管理员）
    /关闭解析 [全局]   关闭自动解析（管理员）
    /解析状态          查看总开关、触发方式、本会话状态
    /解析历史 [条数]   查看最近解析记录（管理员）

  WebUI：插件页面「推特解析历史」可查看/清空历史与统计（成功率、媒体数、流量、常解析作者）。
  LLM Tool：`parse_twitter_link`，可让模型在对话中按需调用。
version: 1.3.0
author: huliaiya
repo: https://github.com/huliaiya/astr-twitter
astrbot_version: ">=4.9.2"
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - lark
  - slack
  - kook
  - satori
  - misskey
  - matrix
  - mattermost
pages:
