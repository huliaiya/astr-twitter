<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X 解析历史</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #6b7280;
        --line: #e5e7eb;
        --card: #f7f8fa;
        --accent: #1d9bf0;
        --danger: #ef4444;
        --ok: #10b981;
      }
      html[data-theme="dark"] {
        --bg: #16181c;
        --fg: #e7e9ea;
        --muted: #9aa0a6;
        --line: #2f3336;
        --card: #1c1f23;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 14px 14px 40px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
      h1 { font-size: 17px; margin: 0; }
      .grow { flex: 1; }
      .header-btns { display: flex; gap: 6px; }
      button {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      button.danger:hover { border-color: var(--danger); color: var(--danger); }
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin: 10px 0 8px; }
      .stat-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .stat-card .k { color: var(--muted); font-size: 11px; }
      .stat-card .v { font-size: 18px; font-weight: 600; margin-top: 2px; }
      .stat-card .v.ok { color: var(--ok); }
      .stat-card .v.bad { color: var(--danger); }
      .stat-card .v.accent { color: var(--accent); }

      .records-list { display: flex; flex-direction: column; gap: 8px; }
      .record-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .record-header {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px;
        cursor: pointer;
        user-select: none;
      }
      .record-header:active { background: var(--line); }
      .status-badge {
        width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px;
      }
      .status-badge.ok { background: rgba(16,185,129,.15); color: var(--ok); }
      .status-badge.bad { background: rgba(239,68,68,.15); color: var(--danger); }
      .record-main { flex: 1; min-width: 0; }
      .record-time { font-size: 13px; color: var(--muted); }
      .record-url { font-size: 13px; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
      .expand-icon { color: var(--muted); font-size: 18px; transition: transform .15s; flex-shrink: 0; }
      .record-card.expanded .expand-icon { transform: rotate(180deg); }
      .record-details {
        max-height: 0; overflow: hidden;
        background: var(--bg);
        border-top: 1px solid var(--line);
        transition: max-height .25s ease, padding .15s ease;
      }
      .record-card.expanded .record-details { max-height: 800px; padding: 12px 14px; }
      .detail-row { display: flex; gap: 10px; margin-bottom: 8px; font-size: 13px; }
      .detail-row:last-child { margin-bottom: 0; }
      .detail-label { color: var(--muted); min-width: 64px; flex-shrink: 0; }
      .detail-value { color: var(--fg); word-break: break-all; flex: 1; }
      .detail-value a { color: var(--accent); }
      .pill {
        display: inline-block; padding: 2px 8px; margin: 0 4px 4px 0;
        border: 1px solid var(--line); border-radius: 999px;
        font-size: 11px; color: var(--muted); background: var(--card);
      }
      .pills { display: flex; flex-wrap: wrap; gap: 4px; }
      .empty { color: var(--muted); padding: 32px 12px; text-align: center; font-size: 13px; }
      .hide { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">X 解析历史</h1>
      <div class="grow"></div>
      <div class="header-btns">
        <button id="refresh">刷新</button>
        <button id="clear" class="danger">清空</button>
      </div>
    </header>

    <div class="stats-grid" id="cards"></div>
    <div class="meta" id="meta" style="font-size:12px;color:var(--muted);margin-bottom:8px;"></div>

    <div class="records-list" id="recordsList"></div>
    <div class="empty hide" id="empty">还没有解析记录，去群里发个 X 链接试试～</div>

    <script src="./app.js"></script>
  </body>
</html>
